name: Trivy SPDX and JSON SBOM generation

on:
  push:
    branches:
      - main
      - master

jobs:
  sbom_generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      # Generate Trivy SBOM in JSON format
      - name: Generate Trivy SBOM JSON
        run: trivy fs --format json --output trivy-results.json .

      # Generate Trivy SBOM in SPDX format
      - name: Generate Trivy SBOM SPDX
        run: trivy fs --format spdx --output trivy-results.spdx .

      # Upload JSON SBOM
      - name: Upload Trivy JSON SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-json
          path: trivy-results.json

      # Upload SPDX SBOM
      - name: Upload Trivy SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-spdx
          path: trivy-results.spdx
